# 1000 m x 1000 m example with a seeded random map.
# Units: metres, m/s. See scenarios/README.md for every key.
#
# Physical parameters are scaled for a field-size map. They are a starting
# point, not a tuned set: run `python config.py big1000` after every change.

description: 1000 m field, 5 UAVs, random obstacles (seed 7)
xlim: [0, 1000]
ylim: [0, 1000]
viewing_radius: 25        # half side of the camera footprint (m)
tar_max_speed: 5          # target speed (m/s)

starts:                   # [x, y, z]; edit with pick_waypoints.py (key u)
- [474.792, 392.219, 30]
