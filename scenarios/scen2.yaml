# 1000 m x 1000 m example with a seeded random map.
# Units: metres, m/s. See scenarios/README.md for every key.
#
# Physical parameters are scaled for a field-size map. They are a starting
# point, not a tuned set: run `python config.py big1000` after every change.

description: 1000 m field, 5 UAVs, random obstacles (seed 7)
xlim: [0, 1000]
ylim: [0, 1000]
viewing_radius: 25        # half side of the camera footprint (m)
tar_max_speed: 5          # target speed (m/s)

starts:                   # [x, y, z]; edit with pick_waypoints.py (key u)
- [474.792, 392.219, 30]
- [380.683, 57.46, 30]
- [83.569, 101.826, 30]
- [125.245, 337.098, 30]
- [28.448, 194.59, 30]
- [321.529, 404.318, 30]
- [755.774, 148.88, 30]

target:
  waypoints:              # edit with pick_waypoints.py (key t)
  - [100, 100]
  - [277.164, 327.687]
  - [400.85, 208.034]
  - [736.952, 320.965]
  - [818.962, 381.463]
  - [829.717, 482.294]
  - [738.297, 495.738]
  - [603.856, 361.297]
  - [504.369, 393.563]
  - [563.523, 585.814]
  - [710.064, 731.01]
  - [759.807, 881.584]
  - [680.487, 896.373]
  - [566.212, 768.654]
  - [283.886, 849.318]
  - [154.822, 843.941]
  - [105.079, 729.666]
  - [149.445, 628.835]
  - [404.883, 592.536]
  - [414.294, 487.672]
  - [158.856, 482.294]
  - [149.445, 389.53]
  # speeds: [5, 5, 3, 5, 5]   # optional, one per segment

obstacles:                # fixed obstacles, added before the random ones
  rects: []               # [x, y, w, h]
  circles: []             # [cx, cy, r]

generate:
  seed: 1
  density: 0.12           # fraction of the map covered by obstacles
  rect_size: [20, 60]     # side length range (m)
  circle_radius: [10, 25] # radius range (m)
  circle_fraction: 0.4
  min_gap: 15             # clearance between obstacles (m)
  border_margin: 10       # keep obstacles off the map border (m)
  keep_clear_radius: 40   # free zone around UAV starts and target waypoints (m)
  path_clearance: 12      # free corridor along the target segments (m); 0 = off

params:
  # ─── Dynamics / MPC ───
  TIMESTEP: 0.1
  HORIZON_LENGTH: 20        # reach = VMAX * H * dt = 20 m
  VMAX: 10
  UMAX: 5                   # VMAX / UMAX = 2 s = horizon length
  ROBOT_RADIUS: 0.5         # safety radius; 2*VMAX*dt <= 2R (no tunnelling)
  CORRIDOR_BOX: 25          # >= horizon reach
  CORRIDOR_BARRIER_EPS: 1.0
  COST_LENGTH_SCALE: 10     # map / FOV are 10x the 50 m scenarios -> distances / 10 in the cost
  W_sat_slot: 10            # distances are scaled down, control effort is not: at 1 the slot pull
                            # loses to W_u and satellites trail their slot by ~15 m
  # ─── Sensing ───
  SENSING_RADIUS: 50
  SENSING_NEIGHBOR: 45      # >= 2 * reach + 2R
  LIDAR_RANGE_MIN: 0.5
  LIDAR_NOISE: 0.05
  LIDAR_MARCH_STEP: 0.5
  # ─── Occupancy grid / planner ───
  GRID_RESOLUTION: 2.0      # ray spacing at 50 m is 1.75 m < 2 m
  INFLATE_MARGIN: 1.0       # INFLATE_RADIUS = 2 m
  START_SNAP_RADIUS: 20
  GOAL_SNAP_RADIUS: 100       # (JPS planner only)
  GOAL_CLAMP_MARGIN: 10
  PLANNER: local
  LOCAL_PLAN_RADIUS: 150      # planning window half size (m) -> 151 x 151 cells
  UNKNOWN_POLICY: optimistic  # the target is usually far outside what the UAV has seen
  UNKNOWN_COST: 1.5           # prefer known-free space when it is not much longer
  TARGET_REPLAN_THRESHOLD: 15
  PATH_DEVIATION_THRESHOLD: 20
  # ─── Target estimation / target path ───
  KF_OBS_NOISE_STD: 1.0
  TAR_RADIUS: 1.0
  SAFETY_MARGIN: 3.0
  TAR_SPLINE_DS: 2.0
  TARGET_ARRIVAL_TOL: 1.0
