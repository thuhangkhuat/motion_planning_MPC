# Leader hand-off test (copy of scen3 with sprints): the target sprints faster
# than the UAVs can fly. Units: metres, m/s. See scenarios/README.md for every key.
#
# 1000 x 1000 m map. Most legs are 5 m/s; four legs are 13 m/s sprints
# (> VMAX = 10) in four directions, spread over the mission: leg 9 west (99 m),
# leg 27 south (84 m), leg 37 north (99 m), leg 48 east (93 m). During a sprint the leader falls behind, the target
# leaves its FOV and enters the FOV of the satellite on that side, which takes
# over as leader. CBF_BOX_RATIO 0.5 keeps the target well inside the leader's FOV
# on the 5 m/s legs, so the hand-offs come from the sprints only.

description: leader hand-off test, scen3 path with 4 sprints at 13 m/s, CBF box 0.5
xlim: [0, 1000]
ylim: [0, 1000]
viewing_radius: 25        # half side of the camera footprint (m)
tar_max_speed: 5          # target speed on the legs without an entry in `speeds` (m/s)

